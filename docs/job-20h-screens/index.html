<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job 20h — one lock engine</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px; background: #14121f; color: #f4f1ff; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  h1, h2 { font-family: "Fredoka", "Segoe UI", sans-serif; font-weight: 600; }
  h1 { margin: 0 0 4px; font-size: 30px; }
  .sub { color: #c9c0f5; margin: 0 0 26px; }
  h2 { margin: 30px 0 10px; color: #fff6c8; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  figure { margin: 0; background: #1b1442; border: 2px solid #3a2f7a; border-radius: 16px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { padding: 8px 12px 10px; color: #c9c0f5; font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
<h1>Job 20h — one lock engine</h1>
<p class="sub">v0.17.23 · the daily limit (27m) wins over the 8:30 PM schedule on all surfaces</p>

<h2>Pill</h2>
<div class="grid">
  <figure><img src="pill-daily-night.png" alt="Pill night"><figcaption>Lock in 27m — Night sky</figcaption></figure>
  <figure><img src="pill-daily-gray.png" alt="Pill gray"><figcaption>Lock in 27m — Moon gray</figcaption></figure>
  <figure><img src="pill-daily-night-es.png" alt="Pill es-MX"><figcaption>Bloqueo en 27m — es-MX</figcaption></figure>
</div>

<h2>Kid Home</h2>
<div class="grid">
  <figure><img src="kid-home-night-en.png" alt="Kid Home night"><figcaption>Time left today 27m · Next lock 27m (screen time) — Night</figcaption></figure>
  <figure><img src="kid-home-gray-en.png" alt="Kid Home gray"><figcaption>Time left today 27m · Next lock 27m (screen time) — Gray</figcaption></figure>
  <figure><img src="kid-home-night-es.png" alt="Kid Home es-MX"><figcaption>Same numbers in es-MX</figcaption></figure>
</div>

<h2>Parent dashboard</h2>
<div class="grid">
  <figure><img src="dashboard-home.png" alt="Dashboard Home"><figcaption>27 min left today and Next schedule 8:30 PM</figcaption></figure>
</div>
</body>
</html>
